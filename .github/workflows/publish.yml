name: Publish

on:
  push:
    tags: ["v*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    runs-on: ubuntu-latest
    needs: [verify]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | head -2 | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "${{ github.ref_name }}" ]; then
            CHANGES=$(git log --pretty=format:"- %s" HEAD~20..HEAD 2>/dev/null || git log --pretty=format:"- %s")
          else
            CHANGES=$(git log --pretty=format:"- %s" ${PREV_TAG}..HEAD)
          fi
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          name: verified-wheel
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*.whl
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.changes }}

            ## Install

            ```bash
            pip install cortex-claude==${{ github.ref_name }}
            ```

            See [README](https://github.com/rafaelaugustos/cortex-claude#quick-start) for setup instructions.
          draft: false
          prerelease: false

  pypi:
    runs-on: ubuntu-latest
    needs: [verify]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-wheel
          path: dist
      - name: Publish verified wheel to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
