name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cortex_claude/web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/cortex_claude/web/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --all-extras --python 3.12
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-test-results
          path: src/cortex_claude/web/frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}

      - name: Download spaCy model
        run: uv run python -m spacy download en_core_web_sm

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short --junitxml=test-results/python.xml

      - name: Upload Python failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  package:
    needs: [test, dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --all-extras --python 3.12
      - run: npm ci
        working-directory: src/cortex_claude/web/frontend
      - name: Verify reproducible wheel and bundled dashboard
        run: uv run python scripts/release.py build --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: verified-wheel
          path: dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: |
            dist/SHA256SUMS
            dist/build-report.json
